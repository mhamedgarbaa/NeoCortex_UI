version: "3.9"


services:
  db:
    image: postgres:15
    container_name: workspace_db
    environment:
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_pass
      POSTGRES_DB: workspace_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_user -d workspace_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: khaledgardabbou7/ontology-backend:latest
    container_name: ontology_api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "7777:7777"
    volumes:
      - ./data/ontology_output:/app/data/ontology_output

volumes:
  pgdata:
